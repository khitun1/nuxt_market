name: CI

on:
  [push, pull_request]

jobs:
  tests-and-build:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-versions: [18.x, 20.x]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-versions }}
          cache: 'npm'

      - name: Install
        run: npm install --legacy-peer-deps

      - name: Tests
        run: npm run test

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build
